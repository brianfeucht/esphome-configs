# Test configuration for the propane monitor package - local import
substitutions:
  name: propane-test
  friendly_name: Propane Test
  propane_mac: "00:00:00:00:00:01"

packages:
  propane: !include ../packages/propane/propane-monitor.yaml

# Real devices set their own key; encrypted OTA needs one to inherit.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
