# Test configuration for the ratgdo32 dry contact + encoder package - local import
substitutions:
  id_prefix: ratgdo_test
  device_name: ratgdo-test
  friendly_name: Garage Door Test

packages:
  ratgdo: !include ../packages/garage/ratgdo-drycontact-enc.yaml

# Real devices set their own key; encrypted OTA needs one to inherit.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
