# Test configuration for the HiFi-ESP32-S3 package - local import
substitutions:
  friendly_name: HiFi Test
  id_prefix: hifi-test

packages:
  hifi: !include ../packages/audio/hifi-esp32-s3.yaml

# Real devices set their own key; encrypted OTA needs one to inherit.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
