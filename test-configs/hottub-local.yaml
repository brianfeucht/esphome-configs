packages:
  esphome_base: !include ../packages/base.yaml
  hottub_balboa: !include ../packages/hottub/balboa.yaml

# Override logger for Balboa-specific settings
logger:
  level: DEBUG
  logs:
    BalboaSpa.CRC: NONE

# Real devices set their own key; base.yaml's encrypted OTA needs one to inherit.
api:
  encryption:
    key: !secret api_encryption_key
