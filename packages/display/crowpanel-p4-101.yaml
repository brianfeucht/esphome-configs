# ============================================================
# Board: Elecrow CrowPanel Advanced 10.1" ESP32-P4
# ============================================================
# Pins follow Elecrow's own ESPHome example (example/V1.0/ESPHome in
# Elecrow-RD/CrowPanel-Advanced-10.1inch-ESP32-P4-HMI-AI-Display-...),
# cross-checked against two community configs running on V1.2 boards.
# The panel is an EK79007, the same glass and init sequence as ESPHome's
# WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B model; only its reset pin differs.
# Wi-Fi comes from an ESP32-C6 over SDIO (esp32_hosted).
# Audio (NS4168 amp, PDM mic), the AHT20, SD card and UARTs are not set up.
#
# Required substitutions: name, friendly_name.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  name_add_mac_suffix: false

esp32:
  variant: esp32p4
  # Boards shipped so far carry pre-v3 P4 silicon ("chip revision: v1.3" in
  # the boot log). A v3 build will not boot on them. If your boot log shows
  # v3.x, flip this to false.
  engineering_sample: true
  cpu_frequency: 360MHZ
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      # No execute_from_psram: on this board's rev 1.3 silicon it puts
      # startup flash reads on a PSRAM stack and the app asserts in
      # spi_flash_disable_interrupts_caches_and_other_cpu before it logs.
      enable_idf_experimental_features: true   # 200 MHz PSRAM

psram:
  mode: hex
  speed: 200MHz

# MIPI-DSI PHY (ch 3) and the panel's second rail (ch 4).
esp_ldo:
  - channel: 3
    voltage: 2.5V
  - channel: 4
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  active_high: true
  reset_pin: GPIO32
  cmd_pin: GPIO19
  clk_pin: GPIO18
  # Transport buffers in PSRAM: keeps the pool without starving internal
  # RAM (otherwise inbound API traffic can stall silently).
  use_psram: true
  # SDIO data lines depend on the board revision. This is V1.2: 4-bit,
  # D0-D3 = GPIO17-14. V1.0 boards (and Elecrow's V1.0 ESPHome example)
  # use D0 = GPIO14; on a V1.2 that hangs setup or leaves the C6 mute.
  bus_width: 4
  d0_pin: GPIO17
  d1_pin: GPIO16
  d2_pin: GPIO15
  d3_pin: GPIO14

i2c:
  - id: bus_a
    sda: GPIO45
    scl: GPIO46
    frequency: 400kHz

# LCD + touch power, high = on. Never switched off; idle dims the backlight.
switch:
  - platform: gpio
    id: panel_power
    pin: GPIO29
    restore_mode: ALWAYS_ON
    internal: true

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO31
    frequency: 30000Hz   # above audible; the default whines on some panels

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    icon: mdi:tablet-dashboard
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

display:
  - platform: mipi_dsi
    id: panel
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin: GPIO41
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    display: panel
    reset_pin: GPIO40
    interrupt_pin: GPIO42
    update_interval: 20ms
    on_touch:
      - script.execute: wake

# Keeps the C6's Wi-Fi firmware in step with what esp32_hosted expects.
http_request:
update:
  - platform: esp32_hosted
    name: Wi-Fi Coprocessor
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h
