# Main panel - Upstairs: scenes, under-cabinet themes, HA entities and scripts.

globals:
  - id: upstairs_mode    # 0 wakeup, 1 morning, 2 afternoon, 3 full, 4 evening, 5 off, 6 custom
    type: int
    initial_value: "-1"
  - id: upstairs_on
    type: int
    initial_value: "0"
  - id: cab_theme        # index into the theme row, -1 = none matches
    type: int
    initial_value: "-1"
  - id: upstairs_hold
    type: int
    initial_value: "-1"
  - id: theme_hold
    type: int
    initial_value: "-1"

sensor:
  # ---- Upstairs: keep in step with tools/panel_scenes.py ----
  - platform: homeassistant
    id: foyer_bri
    entity_id: light.foyer_entry_chandelier
    attribute: brightness
    internal: true
    on_value:
      - lvgl.slider.update:
          id: foyer_slider
          value: !lambda |-
            return std::isnan(x) ? 0 : roundf(x * 100.0f / 255.0f);
      - lvgl.label.update:
          id: foyer_value
          text: !lambda |-
            if (std::isnan(x) || x <= 0) return std::string("Off");
            return str_sprintf("%d%%", (int) roundf(x * 100.0f / 255.0f));
      - lvgl.widget.update:
          id: foyer_card
          state:
            checked: !lambda return !std::isnan(x) && x > 0;
      - script.execute: upstairs_refresh

