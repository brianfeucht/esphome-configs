        # Yamaha receiver
        - obj:
            id: yamaha_card
            <<: *card
            x: 32
            y: 322
            width: 960
            height: 150
            widgets:
              - label: {<<: *card_icon, text: "\U000F093D"}
              - label: {<<: *card_name, text: Receiver}
              - label: {<<: *card_value, id: yamaha_status}
              - obj:
                  styles: s_bare
                  scrollable: false
                  align: BOTTOM_MID
                  width: 100%
                  height: 56
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 12
                  widgets:
                    - button:
                        id: yamaha_power
                        width: 64
                        height: 56
                        on_click:
                          - homeassistant.action: {action: media_player.toggle, data: {entity_id: media_player.basement_wenatchee}}
                        widgets:
                          - label: {text: "\U000F0425", text_font: f_icon, align: CENTER}
                    - button:
                        id: yamaha_mute
                        width: 64
                        height: 56
                        on_click:
                          - homeassistant.action:
                              action: media_player.volume_mute
                              data:
                                entity_id: media_player.basement_wenatchee
                                is_volume_muted: !lambda |-
                                  return std::string(id(yamaha_muted).state == "True" ? "false" : "true");
                        widgets:
                          - label: {text: "\U000F0581", text_font: f_icon, align: CENTER}
                    - button:
                        id: yamaha_down
                        width: 64
                        height: 56
                        on_click:
                          - script.execute: {id: yamaha_step, delta_db: -1}
                        widgets:
                          - label: {text: "\U000F0374", text_font: f_icon, align: CENTER}
                    - slider:
                        id: yamaha_slider
                        flex_grow: 1
                        height: 16
                        min_value: -90          # -45 dB, in half-dB units
                        max_value: -50          # -25 dB
                        value: -90
                        on_release:
                          - lambda: id(yamaha_target) = (161 + x) / 161.0f;
                          - homeassistant.action:
                              action: media_player.volume_set
                              data:
                                entity_id: media_player.basement_wenatchee
                                volume_level: !lambda return id(yamaha_target);
                          - script.execute: yamaha_settle
                    - button:
                        id: yamaha_up
                        width: 64
                        height: 56
                        on_click:
                          - script.execute: {id: yamaha_step, delta_db: 1}
                        widgets:
                          - label: {text: "\U000F0415", text_font: f_icon, align: CENTER}

