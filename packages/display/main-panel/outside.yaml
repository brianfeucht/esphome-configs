binary_sensor:
  - platform: homeassistant
    id: party_on
    entity_id: switch.outside_patio_party_lights
    internal: true
    trigger_on_initial_state: true   # else the first state from HA never draws
    on_state:
      - lvgl.label.update:
          id: party_value
          text: !lambda |-
            return std::string(x ? "On" : "Off");
      - lvgl.widget.update:
          id: party_card
          state:
            checked: !lambda return x;
      - script.execute: outside_refresh

  - platform: homeassistant
    id: sideflood_on
    entity_id: light.garage_garage_flood_lights
    internal: true
    trigger_on_initial_state: true   # else the first state from HA never draws
    on_state:
      - lvgl.label.update:
          id: sideflood_value
          text: !lambda |-
            return std::string(x ? "On" : "Off");
      - lvgl.widget.update:
          id: sideflood_card
          state:
            checked: !lambda return x;
      - script.execute: outside_refresh

  - platform: homeassistant
    id: driveflood_on
    entity_id: light.outside_garage_driveway_flood
    internal: true
    trigger_on_initial_state: true   # else the first state from HA never draws
    on_state:
      - lvgl.label.update:
          id: driveflood_value
          text: !lambda |-
            return std::string(x ? "On" : "Off");
      - lvgl.widget.update:
          id: driveflood_card
          state:
            checked: !lambda return x;
      - script.execute: outside_refresh

script:
  # Which scene the yard matches. Low/High match on brightness bands
  # because Z-Wave dimmers round 128 to 129 and 255 to 252-255.
  - id: outside_refresh
    then:
      - lambda: |-
          const float sconces[] = {
            id(deck_bri).state, id(entry_bri).state, id(garage_bri).state,
            id(laundry_bri).state, id(hottub_bri).state, id(bedpatio_bri).state,
          };
          int on = 0, low = 0, high = 0;
          for (float b : sconces) {
            if (std::isnan(b) || b <= 0) continue;
            on++;
            if (b >= 100 && b <= 160) low++;
            if (b >= 230) high++;
          }
          const int floods = id(sideflood_on).state + id(driveflood_on).state;
          const bool party = id(party_on).state;
          on += floods + party;

          int mode = 3;
          if (on == 0) mode = 0;
          else if (low == 6 && floods == 0 && party) mode = 1;
          else if (high == 6 && floods == 2 && party) mode = 2;
          if (id(outside_hold) >= 0) mode = id(outside_hold);
          id(outside_mode) = mode;
          id(outside_on) = on;
      - lvgl.label.update:
          id: [home_outside_status, outside_status]
          text: !lambda |-
            // The highlighted button names the scene; only call out Custom.
            if (id(outside_on) == 0) return std::string("All off");
            return str_sprintf("%s%d of 9 on", id(outside_mode) == 3 ? "Custom · " : "", id(outside_on));
      - lvgl.widget.update:
          id: [tile_outside, tile_outside_hd]
          state:
            checked: !lambda return id(outside_on) > 0;
      - lvgl.widget.update:
          id: [home_off, outside_off]
          state:
            checked: !lambda return id(outside_mode) == 0;
      - lvgl.widget.update:
          id: [home_low, outside_low]
          state:
            checked: !lambda return id(outside_mode) == 1;
      - lvgl.widget.update:
          id: [home_high, outside_high]
          state:
            checked: !lambda return id(outside_mode) == 2;

  # *_pick: highlight the tapped scene right away instead of waiting for
  # the lights, and hold it for 6 s while they report in; the refresh
  # after the hold corrects it if the room ended up elsewhere.
  - id: outside_pick
    mode: restart
    parameters:
      mode: int
    then:
      - lambda: id(outside_hold) = mode;
      - script.execute: outside_refresh
      - delay: 6s
      - lambda: id(outside_hold) = -1;
      - script.execute: outside_refresh
