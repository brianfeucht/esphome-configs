# Main panel - Outside: scene state, HA entities and scripts.

globals:
  - id: outside_mode     # 0 off, 1 low, 2 high, 3 custom
    type: int
    initial_value: "-1"
  - id: outside_on       # fixtures currently on
    type: int
    initial_value: "0"

  # Scene just tapped, held on the buttons while the lights report in one
  # by one (else the half-changed room matches nothing and the button
  # flickers off). -1 = no hold. See *_pick.
  - id: outside_hold
    type: int
    initial_value: "-1"

# ============================================================
# HA entities mirrored onto the cards
# Outside: keep in step with tools/panel_scenes.py
# ============================================================
# HA reports no brightness while a light is off, which arrives as NaN.
sensor:
  - platform: homeassistant
    id: deck_bri
    entity_id: light.outside_deck_sconces
    attribute: brightness
    internal: true
    on_value:
      - lvgl.slider.update:
          id: deck_slider
          value: !lambda |-
            return std::isnan(x) ? 0 : roundf(x * 100.0f / 255.0f);
      - lvgl.label.update:
          id: deck_value
          text: !lambda |-
            if (std::isnan(x) || x <= 0) return std::string("Off");
            return str_sprintf("%d%%", (int) roundf(x * 100.0f / 255.0f));
      - lvgl.widget.update:
          id: deck_card
          state:
            checked: !lambda return !std::isnan(x) && x > 0;
      - script.execute: outside_refresh

  - platform: homeassistant
    id: entry_bri
    entity_id: light.foyer_entry_exterior_sconce
