# Propane tank monitor - ESP-WROOM-32 reading the tank sensor's BLE advertisements.
# Ported from Parkdale's ble-proxy-west (packages/machine-room/ble-proxy.yaml).
#
# Required substitutions: name, friendly_name, propane_mac.
# The device sets api encryption, ota and wifi.
esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:

# No bluetooth_proxy: HA would run the scanner passive, and the sensor's name,
# which carries the level, only arrives in response to an active scan.
esp32_ble_tracker:
  scan_parameters:
    active: true
    window: 30ms
    interval: 100ms
  on_ble_advertise:
    - mac_address: ${propane_mac}
      then:
        - lambda: |-
            ESP_LOGD("ble_adv", "  name: %s", x.get_name().c_str());
            std::string name = x.get_name();
            if (esphome::str_startswith(name, "level:")) {
              name.erase(0,7);
              std::string value = esphome::str_until(name.c_str(), ' ');
              id(propane_level).publish_state(atof(value.c_str()));
              id(propane_sensor_ok).publish_state(true);
            }
            if (esphome::str_startswith(name, "trbl:ACC")) {
              name.erase(0,10);
              std::string value = esphome::str_until(name.c_str(), ')');
              id(propane_level).publish_state(atof(value.c_str()));
              id(propane_sensor_ok).publish_state(false);
            }

sensor:
  # Holds the level parsed from the advertisement above.
  - platform: template
    name: Propane Level
    id: propane_level
    unit_of_measurement: '%'
    state_class: measurement
    accuracy_decimals: 1
  - platform: ble_rssi
    mac_address: ${propane_mac}
    name: Propane RSSI
    id: propane_rssi
    filters:
      # Smooth readings as they are very noisy
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15

binary_sensor:
  - platform: template
    name: Propane Sensor Ok
    id: propane_sensor_ok
